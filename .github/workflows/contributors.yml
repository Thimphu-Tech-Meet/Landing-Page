name: Update contributors

# Rebuilds the visual contributor grid in CONTRIBUTORS.md every time main
# changes (a merged PR always produces a push to main, so a separate
# pull_request trigger is not needed and would only double the runs).
# Uses a free community action — no paid automation, no extra secrets.
#
# main is protected by the "Maintainer-review-require" ruleset. Rather than
# open a PR that a human must approve for every contributor change, the
# GitHub Actions app is listed as a bypass actor on that ruleset, so this
# workflow's GITHUB_TOKEN may commit the regenerated grid straight to main.
# auto_detect_branch_protection is therefore turned off; if the bypass is
# ever removed, flip it back to true and add `pull-requests: write` so the
# action falls back to opening a PR instead.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update contributors list in CONTRIBUTORS.md
        uses: akhilmhdh/contributors-readme-action@v2.3.10
        with:
          readme_path: CONTRIBUTORS.md
          commit_message: "docs: update contributors grid [skip ci]"
          committer_username: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"
          auto_detect_branch_protection: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
