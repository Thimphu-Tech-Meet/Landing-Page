<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Pure AI flow: employee asks, model calls a draft tool, the real form opens pre-filled, and a person clicks submit">
<style>
  .bg{fill:#fbfbf9} .panel{fill:#f2f3f0;stroke:#d9dcd8;stroke-width:1.5}
  .chip{fill:#fbfbf9;stroke:#d9dcd8;stroke-width:1}
  .hot{fill:#f6e3df;stroke:#b5301f;stroke-width:1.5}
  .ink{fill:#171a1f} .ink2{fill:#4b525c} .ink3{fill:#7c838c} .acc{fill:#b5301f} .onacc{fill:#ffffff}
  .grid{stroke:#e7e9e5;stroke-width:1} .axis{stroke:#d9dcd8;stroke-width:1}
  .wire{stroke:#4b525c;stroke-width:2;fill:none} .wire-acc{stroke:#b5301f;stroke-width:2.5;fill:none}
  .wire-dead{stroke:#7c838c;stroke-width:2;fill:none;stroke-dasharray:7 6}
  .ring{stroke:#fbfbf9;stroke-width:2}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1e24} .panel{fill:#12151a;stroke:#2c323a} .chip{fill:#1a1e24;stroke:#2c323a}
    .hot{fill:#3a1f1b;stroke:#e0553f}
    .ink{fill:#eeefea} .ink2{fill:#aeb4bc} .ink3{fill:#8a919a} .acc{fill:#e0553f} .onacc{fill:#12151a}
    .grid{stroke:#22272e} .axis{stroke:#2c323a}
    .wire{stroke:#aeb4bc} .wire-acc{stroke:#e0553f} .wire-dead{stroke:#8a919a} .ring{stroke:#1a1e24}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink3"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1200" height="430" rx="0"/>
<text x="40" y="52" class="ink" font-size="26" font-weight="800">The AI drafts. People decide.</text>
<text x="40" y="80" class="ink2" font-size="15" >Every AI action opens the real, permission-checked form, pre-filled. Nothing is sent until a person clicks.</text>
<rect class="panel" x="40" y="150" width="250" height="160" rx="14"/>
<circle class="acc" cx="70" cy="182" r="14"/>
<text x="70" y="187" class="onacc" font-size="14" font-weight="800" text-anchor="middle">1</text>
<text x="94" y="188" class="ink" font-size="17" font-weight="700">Employee asks</text>
<text x="60" y="240" class="ink2" font-size="15" >"Report 3 broken</text>
<text x="60" y="264" class="ink2" font-size="15" >items from the line"</text>
<path class="wire" d="M292 230 H328" marker-end="url(#ah)"/>
<rect class="panel" x="330" y="150" width="250" height="160" rx="14"/>
<circle class="acc" cx="360" cy="182" r="14"/>
<text x="360" y="187" class="onacc" font-size="14" font-weight="800" text-anchor="middle">2</text>
<text x="384" y="188" class="ink" font-size="17" font-weight="700">Model calls a tool</text>
<text x="350" y="240" class="ink2 mono" font-size="13.5" >draft_incident_report,</text>
<text x="350" y="264" class="ink2 mono" font-size="13.5" >draft_task, draft_mail…</text>
<path class="wire" d="M582 230 H618" marker-end="url(#ah)"/>
<rect class="panel" x="620" y="150" width="250" height="160" rx="14"/>
<circle class="acc" cx="650" cy="182" r="14"/>
<text x="650" y="187" class="onacc" font-size="14" font-weight="800" text-anchor="middle">3</text>
<text x="674" y="188" class="ink" font-size="17" font-weight="700">Form opens, pre-filled</text>
<text x="640" y="240" class="ink2" font-size="15" >nothing saved,</text>
<text x="640" y="264" class="ink2" font-size="15" >nothing notified</text>
<path class="wire" d="M872 230 H908" marker-end="url(#ah)"/>
<rect class="hot" x="910" y="150" width="250" height="160" rx="14"/>
<circle class="acc" cx="940" cy="182" r="14"/>
<text x="940" y="187" class="onacc" font-size="14" font-weight="800" text-anchor="middle">4</text>
<text x="964" y="188" class="ink" font-size="17" font-weight="700">Person clicks Submit</text>
<text x="930" y="240" class="ink2" font-size="15" >real write, real RLS,</text>
<text x="930" y="264" class="ink2" font-size="15" >real notifications</text>
<line class="wire-dead" x1="895" y1="120" x2="895" y2="340"/>
<text x="870" y="360" class="ink3" font-size="13" text-anchor="end">AI side</text>
<text x="920" y="360" class="acc" font-size="13" font-weight="600">human side</text>
<text x="40" y="400" class="ink2" font-size="15" >The tool queries run with the employee's own JWT, so Postgres RLS (not the prompt) limits what the model can read.</text>
</svg>
