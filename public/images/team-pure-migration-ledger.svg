<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="Migrations in supabase/migrations are never deployed; only the drizzle/migrations ledger reaches production">
<style>
  .bg{fill:#fbfbf9} .panel{fill:#f2f3f0;stroke:#d9dcd8;stroke-width:1.5}
  .chip{fill:#fbfbf9;stroke:#d9dcd8;stroke-width:1}
  .hot{fill:#f6e3df;stroke:#b5301f;stroke-width:1.5}
  .ink{fill:#171a1f} .ink2{fill:#4b525c} .ink3{fill:#7c838c} .acc{fill:#b5301f} .onacc{fill:#ffffff}
  .grid{stroke:#e7e9e5;stroke-width:1} .axis{stroke:#d9dcd8;stroke-width:1}
  .wire{stroke:#4b525c;stroke-width:2;fill:none} .wire-acc{stroke:#b5301f;stroke-width:2.5;fill:none}
  .wire-dead{stroke:#7c838c;stroke-width:2;fill:none;stroke-dasharray:7 6}
  .ring{stroke:#fbfbf9;stroke-width:2}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1e24} .panel{fill:#12151a;stroke:#2c323a} .chip{fill:#1a1e24;stroke:#2c323a}
    .hot{fill:#3a1f1b;stroke:#e0553f}
    .ink{fill:#eeefea} .ink2{fill:#aeb4bc} .ink3{fill:#8a919a} .acc{fill:#e0553f} .onacc{fill:#12151a}
    .grid{stroke:#22272e} .axis{stroke:#2c323a}
    .wire{stroke:#aeb4bc} .wire-acc{stroke:#e0553f} .wire-dead{stroke:#8a919a} .ring{stroke:#1a1e24}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink3"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1200" height="530" rx="0"/>
<text x="40" y="52" class="ink" font-size="26" font-weight="800">Two migration folders, one that actually deploys</text>
<text x="40" y="80" class="ink2" font-size="15" >Supabase convention says supabase/migrations/. Lovable's deploy pipeline reads drizzle/migrations/.</text>
<rect class="panel" x="40" y="170" width="250" height="150" rx="14"/><text x="58" y="202" class="ink" font-size="18" font-weight="700">New migration</text><text x="58" y="222" class="ink3 mono" font-size="12" >written by Claude Code</text>
<text x="58" y="250" class="ink2" font-size="14" >e.g. add a column that</text>
<text x="58" y="272" class="ink2" font-size="14" >every login depends on</text>
<rect class="chip" x="380" y="120" width="380" height="96" rx="12"/>
<text x="400" y="152" class="ink mono" font-size="16" font-weight="600">supabase/migrations/*.sql</text>
<text x="400" y="178" class="ink2" font-size="15" >committed, pushed, looks done</text>
<text x="400" y="200" class="ink3" font-size="13" >the folder everyone expects</text>
<rect class="hot" x="380" y="280" width="380" height="96" rx="12"/>
<text x="400" y="312" class="ink mono" font-size="16" font-weight="600">drizzle/migrations/ + _journal.json</text>
<text x="400" y="338" class="ink2" font-size="15" >ordered migration ledger</text>
<text x="400" y="360" class="acc" font-size="13" font-weight="600">the ledger Lovable actually runs</text>
<path class="wire" d="M290 225 H330 V168 H378" marker-end="url(#ah)"/>
<path class="wire-acc" d="M290 265 H330 V328 H378" marker-end="url(#aha)"/>
<text x="40" y="350" class="acc" font-size="14" font-weight="700">Must write both.</text>
<path class="panel" d="M900 160 a110 22 0 0 0 220 0 v170 a110 22 0 0 1 -220 0 z"/>
<ellipse class="panel" cx="1010" cy="160" rx="110" ry="22"/>
<text x="1010" y="250" class="ink" font-size="18" font-weight="700" text-anchor="middle">Production</text>
<text x="1010" y="274" class="ink" font-size="18" font-weight="700" text-anchor="middle">Postgres</text>
<path class="wire-dead" d="M762 168 H896" marker-end="url(#ahd)"/>
<text x="778" y="140" class="ink3" font-size="12.5" >never read:</text>
<text x="778" y="157" class="ink3" font-size="12.5" >no error, no warning</text>
<path class="wire-acc" d="M762 328 H896" marker-end="url(#aha)"/>
<text x="778" y="318" class="acc" font-size="12.5" font-weight="600">deployed</text>
<line class="axis" x1="40" y1="430" x2="1160" y2="430"/>
<text x="40" y="466" class="ink2" font-size="15" >Rule now in CLAUDE.md: every migration is mirrored into the drizzle ledger, and "is it live?" is checked</text>
<text x="40" y="490" class="ink2" font-size="15" >before a feature is called done, especially anything the login flow reads.</text>
</svg>
